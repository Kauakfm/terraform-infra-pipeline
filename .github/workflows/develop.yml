name: "DEV DEPLOY"

on:
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    uses: ./.github/workflows/terraform.yml
    with:
      environment: dev
      aws-assume-role-arn: "arn:aws:iam::946163909419:role/github-actions-kauaKfm-pipeline"
      aws-region: "sa-east-1"
      aws-statefile-s3-bucket: "kauakfm-sa-east-1-terraform-infra-pipeline"
      aws-lock-dynamodb-table: "kauakfm-sa-east-1-terraform-lock"